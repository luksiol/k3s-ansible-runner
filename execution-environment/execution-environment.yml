---
version: 3

images:
  base_image:
    name: oraclelinux:9-slim

dependencies:
  ansible_core:
    package_pip: ansible-core==__ANSIBLE_VERSION__
  ansible_runner:
    package_pip: ansible-runner
  system:
    - openssh-clients
    - sshpass
  galaxy:
    collections:
    - name: ansible.posix
      version: "2.2.0"
# Commit b58b2ca resolve drain ovirt-node-plugin DaemonSet with localstorage but not in stable version right now
#    - name: kubernetes.core
#      version: "6.4.0"
    - name: https://github.com/ansible-collections/kubernetes.core.git
      type: git
      version: main
    - name: ovirt.ovirt
      version: "3.2.2"
    - name: community.vmware
      version: "6.5.0"
    - name: ansible.utils
      version: "6.0.2"
    - name: community.general
      version: "13.5.0"

options:
  user: "0"

additional_build_steps:
  prepend_builder: |
    RUN microdnf install -y python3.12-devel gcc && \
        microdnf clean all

  prepend_base: |
    RUN microdnf install -y oracle-epel-release-el9 && \
        microdnf install -y python3.12 python3.12-pip python3.12-pyyaml yq jq sudo git which file && \
        pip3.12 install --no-cache-dir --only-binary :all: cryptography ansible-navigator passlib bcrypt jmespath dnspython && \
        ln -sf /usr/bin/python3.12 /usr/bin/python3 && \
        ln -sf /usr/bin/pip3.12 /usr/bin/pip && \
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | DESIRED_VERSION="__HELM_VERSION__" bash && \
        HELM_DATA_HOME=/usr/local/share/helm helm plugin install https://github.com/databus23/helm-diff --verify=false --version __HELM_DIFF_VERSION__ && \
        microdnf clean all && \
        chmod -R 777 /usr/local/share/helm/plugins

  append_final: |
    ENV HELM_PLUGINS="/usr/local/share/helm/plugins"

