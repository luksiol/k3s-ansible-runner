name: Build and Push Execution Environment

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
    paths:
      - 'execution-environment/**'
      - 'ee.env'

permissions:
  contents: read
  packages: write

jobs:
  build_push_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load EE configuration
        shell: bash
        run: |
          set -a
          source ./ee.env
          set +a

          echo "ANSIBLE_VERSION=${ANSIBLE_VERSION}" >> "$GITHUB_ENV"
          echo "HELM_VERSION=${HELM_VERSION}" >> "$GITHUB_ENV"
          echo "HELM_DIFF_VERSION=${HELM_DIFF_VERSION}" >> "$GITHUB_ENV"
          echo "EE_IMAGE_NAME=${EE_IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "EE_IMAGE_TAG=a_${ANSIBLE_VERSION}-h_${HELM_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ansible-builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-builder

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare execution environment
        working-directory: execution-environment
        run: |
          sed -i "s/__ANSIBLE_VERSION__/${ANSIBLE_VERSION}/g" execution-environment.yml
          sed -i "s/__HELM_VERSION__/v${HELM_VERSION}/g" execution-environment.yml
          sed -i "s/__HELM_DIFF_VERSION__/v${HELM_DIFF_VERSION}/g" execution-environment.yml

      - name: Build execution environment
        working-directory: execution-environment
        run: |
          ansible-builder build \
            -t "${EE_IMAGE_NAME}:${EE_IMAGE_TAG}" \
            --container-runtime docker

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Tag image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker tag "${EE_IMAGE_NAME}:${EE_IMAGE_TAG}" \
            "ghcr.io/${OWNER_LC}/${EE_IMAGE_NAME}:${EE_IMAGE_TAG}"

      - name: Push image to GHCR
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker push "ghcr.io/${OWNER_LC}/${EE_IMAGE_NAME}:${EE_IMAGE_TAG}"


